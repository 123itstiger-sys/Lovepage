<!DOCTYPE html>
<html>
<head>
<title>Love Page ❤️</title>
<style>
body{
    text-align:center;
    font-family:Arial;
    background:pink;
    margin-top:100px;
}

button{
    padding:10px 20px;
    font-size:20px;
    margin:10px;
    cursor:pointer;
}

#no{
    position:absolute;
}
</style>
</head>

<body>

<h1>Do You Love Me? ❤️</h1>

<button onclick="alert('I Love You Too ❤️')">Yes</button>

<button id="no">No</button>

<script>
let noBtn = document.getElementById("no");

noBtn.addEventListener("mouseover", function() {
    let x = Math.random() * (window.innerWidth - 100);
    let y = Math.random() * (window.innerHeight - 50);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});
</script>

</body>
</html>
