<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Page ❤️</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff4d88,#ff9a8b);
color:white;
text-align:center;
overflow:hidden;
}

.container{
padding:40px 20px;
margin-top:80px;
}

h1{
font-size:3rem;
}

input{
padding:12px;
font-size:18px;
border:none;
border-radius:10px;
width:250px;
max-width:80%;
}

button{
padding:12px 24px;
font-size:18px;
border:none;
border-radius:25px;
cursor:pointer;
margin:10px;
}

#yes{
background:white;
color:#ff2e7a;
}

#no{
background:#ff2e7a;
color:white;
position:relative;
}

.heart{
position:absolute;
font-size:25px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-100px);}
}

#success{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(135deg,#ff4d88,#ff9a8b);
justify-content:center;
align-items:center;
flex-direction:column;
z-index:100;
}
</style>
</head>

<body>

<div class="container">

<h1>❤️ Ghuman Singh ❤️ <span id="nameText">Someone Special</span> ❤️</h1>

<p>
Every beautiful moment reminds me of you.
</p>

<input type="text" id="nameInput" placeholder="Enter Name">

<button onclick="updateName()">Generate ❤️</button>

<h2>Will you always stay special to me? ❤️</h2>

<button id="yes">YES ❤️</button>
<button id="no">NO 😜</button>

</div>

<div id="success">
<h1>🎉 YAYYYY ❤️ 🎉</h1>
<h2 id="successName"></h2>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const urlName = params.get("name");

if(urlName){
document.getElementById("nameText").innerText = urlName;
}

function updateName(){
let name = document.getElementById("nameInput").value;

if(name.trim()!=""){
document.getElementById("nameText").innerText = name;
}
}

document.getElementById("yes").onclick = function(){
let name = document.getElementById("nameText").innerText;

document.getElementById("success").style.display="flex";
document.getElementById("successName").innerHTML =
"❤️ Thank You " + name + " ❤️";
}

const noBtn=document.getElementById("no");

function moveBtn(){
let x=Math.random()*(window.innerWidth-150);
let y=Math.random()*(window.innerHeight-100);

noBtn.style.position="absolute";
noBtn.style.left=x+"px";
noBtn.style.top=y+"px";
}

noBtn.addEventListener("mouseover",moveBtn);
noBtn.addEventListener("click",moveBtn);

function createHeart(){
const heart=document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);
}

setInterval(createHeart,300);

</script>

</body>
</html>
